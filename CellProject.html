<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell Organelles</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 1000px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .video-frame {
            width: 100%;
            height: 450px;
            background: #ddd;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .arrow {
            cursor: pointer;
            font-size: 24px;
            padding: 10px;
        }
        img {
            width: 100%;
            max-width: 300px;
            margin-top: 10px;
            border-radius: 5px;
        }
        .dark-mode-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .dark-mode-button:hover {
            background-color: #444;
        }
        /* Dark Mode Styles */
        body.dark-mode {
            background-color: #000;
            color: white;
        }
        .container.dark-mode {
            background-color: #444;
            color: white;
        }
        .video-frame.dark-mode {
            background-color: #000;
        }
    </style>
</head>
<body>
    <button class="dark-mode-button" onclick="toggleDarkMode()">Toggle Dark Mode</button>
    <div class="container">
        <div class="video-frame">
         <iframe width="100%" height="100%"
src="https://www.youtube.com/embed/0Ratr8HOz9A">
</iframe>
        </div>
        <h1 id="organelles-name"></h1>
        <p id="organelles-description"></p>
        <img id="organelles-image" src="" alt="Organelle Image">
        <div>
            <span class="arrow" onclick="prevOrganelle()">⬅</span>
            <span class="arrow" onclick="nextOrganelle()">➡</span>
        </div>
    </div>

    <script>
        const organelles = [
            { name: "Nucleus", description: "The nucleus is the command center of the cell, housing genetic material in the form of DNA. It controls all cell activities, including growth, metabolism, and reproduction. The nucleus is surrounded by a double membrane called the nuclear envelope, which has pores that regulate the exchange of materials between the nucleus and cytoplasm. Inside the nucleus is the nucleolus, where ribosomes are assembled.", image: "https://raw.githubusercontent.com/GamingBoyZ379/Projects/refs/heads/gh-pages/CellProjectFiles/Nucleus-Diagram.png" },
            { name: "Mitochondria", description: "Mitochondria are the powerhouses of the cell, responsible for generating ATP through cellular respiration. They have a unique double membrane structure and their own DNA, allowing them to produce essential proteins. Mitochondria play a crucial role in energy metabolism, apoptosis, and other cellular processes.", image: "https://raw.githubusercontent.com/GamingBoyZ379/Projects/refs/heads/gh-pages/CellProjectFiles/Mitochondria-Diagram.png" },
            { name: "Ribosomes", description: "Ribosomes are molecular machines that synthesize proteins by translating genetic information from messenger RNA. They can be found floating freely in the cytoplasm or attached to the rough endoplasmic reticulum. Ribosomes play a key role in cellular function by producing enzymes, structural proteins, and signaling molecules.", image: "https://raw.githubusercontent.com/GamingBoyZ379/Projects/refs/heads/gh-pages/CellProjectFiles/Ribosomes-Diagram.png" },
            { name: "Endoplasmic Reticulum", description: "The endoplasmic reticulum (ER) is a vast network of interconnected membranes involved in protein and lipid synthesis. The rough ER is studded with ribosomes and specializes in protein production, while the smooth ER lacks ribosomes and is involved in lipid metabolism, detoxification, and calcium storage.", image: "https://raw.githubusercontent.com/GamingBoyZ379/Projects/refs/heads/gh-pages/CellProjectFiles/Endoplasmic-Reticulum-ER-Diagram.png" },
            { name: "Golgi Apparatus", description: "The Golgi apparatus functions as the cell's packaging and distribution center. It modifies, sorts, and packages proteins and lipids for transport to different destinations within the cell or for secretion. The Golgi also plays a role in the production of lysosomes and certain carbohydrates.", image: "https://raw.githubusercontent.com/GamingBoyZ379/Projects/refs/heads/gh-pages/CellProjectFiles/Golgi-apparatus-Golgi-bodies-or-Golgi-complex-Diagram.png" },
            { name: "Lysosomes", description: "Lysosomes are membrane-bound organelles containing digestive enzymes that break down waste materials, cellular debris, and invading pathogens. They play an essential role in intracellular digestion and recycling, helping to maintain cellular health through autophagy.", image: "https://raw.githubusercontent.com/GamingBoyZ379/Projects/refs/heads/gh-pages/CellProjectFiles/Lysosomes-Diagram.png" },
            { name: "Vacuole", description: "The vacuole is a large, membrane-bound organelle found in plant and fungal cells, as well as some animal and protist cells. It serves as a storage compartment for water, nutrients, and waste products. In plant cells, the central vacuole maintains cell turgor pressure, which is essential for structural support. Vacuoles also play a role in isolating harmful substances and aiding in cellular digestion.", image: "https://raw.githubusercontent.com/GamingBoyZ379/Projects/refs/heads/gh-pages/CellProjectFiles/Vacuoles-Diagram.png" },
            { name: "Cell Membrane", description: "The cell membrane is a selectively permeable barrier that surrounds the cell, separating its internal environment from the external surroundings. It is composed of a phospholipid bilayer with embedded proteins, which regulate the movement of ions, nutrients, and waste products in and out of the cell. The cell membrane also plays a role in cell communication and signaling.", image: "https://raw.githubusercontent.com/GamingBoyZ379/Projects/refs/heads/gh-pages/CellProjectFiles/cellmembrane.png" },
            { name: "Cytoplasm", description: "The cytoplasm is the gel-like substance that fills the cell, providing a medium for biochemical reactions and supporting organelles. It contains cytosol, enzymes, nutrients, and various cellular structures essential for the cell's functions.", image: "https://raw.githubusercontent.com/GamingBoyZ379/Projects/refs/heads/gh-pages/CellProjectFiles/Cytoplasm-Diagram.png" },
            { name: "Cytoskeleton", description: "The cytoskeleton is a complex network of protein filaments that provides structural support, aids in intracellular transport, and enables cell movement. It consists of microtubules, microfilaments, and intermediate filaments, all working together to maintain cell shape and facilitate cellular processes.", image: "https://raw.githubusercontent.com/GamingBoyZ379/Projects/refs/heads/gh-pages/CellProjectFiles/Cytoskeleton-Diagram.png" }
   ];

        let currentOrganelle = 0;

        function updateOrganelle() {
            const organelle = organelles[currentOrganelle];
            document.getElementById("organelles-name").textContent = organelle.name;
            document.getElementById("organelles-description").textContent = organelle.description;
            document.getElementById("organelles-image").src = organelle.image;
        }

        function nextOrganelle() {
            currentOrganelle = (currentOrganelle + 1) % organelles.length;
            updateOrganelle();
        }

        function prevOrganelle() {
            currentOrganelle = (currentOrganelle - 1 + organelles.length) % organelles.length;
            updateOrganelle();
        }

        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
            document.querySelector(".container").classList.toggle("dark-mode");
            document.querySelector(".video-frame").classList.toggle("dark-mode");
        }

        updateOrganelle();  // Initial update when the page loads
    </script>
</body>
</html>
